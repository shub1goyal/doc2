<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyst AI</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>

    <!-- Google's Gemini AI SDK -->
    <script type="importmap">
    {
        "imports": {
            "@google/generative-ai": "https://esm.sh/@google/generative-ai"
        }
    }
    </script>
    <style>
        /* Custom styles for markdown tables */
        .markdown-content table {
            border-collapse: collapse;
            margin: 1rem 0;
            width: 100%;
            background-color: #ffffff;
            border-radius: 0.375rem;
            overflow: hidden;
            table-layout: auto;
            display: table;
            /* Ensure table is displayed properly */
            width: 100%;
            /* Changed from max-content to 100% to fit container */
        }

        .markdown-content th,
        .markdown-content td {
            border: 1px solid #d1d5db;
            padding: 0.75rem 1rem;
            text-align: left;
            vertical-align: top;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: none;
            /* Removed max-width limitation */
            white-space: normal;
            /* Allow text to wrap */
        }

        .markdown-content th {
            background-color: #f3f4f6;
            font-weight: 600;
            color: #1f2937;
            border-bottom: 2px solid #d1d5db;
            white-space: normal;
            /* Allow header text to wrap */
        }

        .markdown-content td {
            background-color: #ffffff;
            color: #1f2937;
            min-width: 100px;
            /* Reduced from 150px */
        }

        .markdown-content tbody tr:nth-child(even) td {
            background-color: #f9fafb;
        }

        .markdown-content tbody tr:hover td {
            background-color: #f3f4f6;
        }

        /* Handle table overflow */
        .markdown-content {
            overflow-x: hidden;
            /* Changed from auto to hidden to prevent scrolling */
            overflow-y: visible;
            /* Allow vertical overflow */
        }

        .markdown-content table {
            min-width: 100%;
            width: 100%;
            /* Ensure tables use full width of container */
        }

        /* Specific column sizing for better layout */
        .markdown-content th:first-child,
        .markdown-content td:first-child {
            min-width: 150px;
            /* Reduced from 250px */
            font-weight: 500;
        }

        .markdown-content th:last-child,
        .markdown-content td:last-child {
            min-width: 100px;
            /* Reduced from 150px */
        }

        /* Ensure the chat container takes full height minus header and input area */
        #chat-container {
            height: calc(100vh - 140px);
        }

        /* Custom styles for HTML content */
        .markdown-content img {
            max-width: 100%;
            height: auto;
            border-radius: 0.375rem;
            margin: 0.5rem 0;
        }

        .markdown-content blockquote {
            border-left: 4px solid #4f46e5;
            padding-left: 1rem;
            margin: 1rem 0;
            color: #4b5563;
        }

        /* Improve code block styling */
        .markdown-content pre {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 0.375rem;
            padding: 1rem;
            overflow-x: auto;
            margin: 1rem 0;
            white-space: pre-wrap;
            /* Wrap long lines */
        }

        .markdown-content code {
            background-color: #f3f4f6;
            padding: 0.125rem 0.25rem;
            border-radius: 0.25rem;
            font-family: 'Courier New', monospace;
        }

        .markdown-content pre code {
            background-color: transparent;
            padding: 0;
        }

        /* Fallback styling for improperly formatted tables */
        .markdown-content p {
            margin: 0.5rem 0;
        }

        .markdown-content p:has(br) {
            white-space: pre-line;
        }

        /* Restore heading and list styles reset by Tailwind CSS Preflight */
        .markdown-content ul {
            list-style-type: disc;
            margin-left: 1.5rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .markdown-content ol {
            list-style-type: decimal;
            margin-left: 1.5rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .markdown-content li {
            margin-bottom: 0.25rem;
            display: list-item;
        }

        .markdown-content h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .markdown-content h2 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .markdown-content h3 {
            font-size: 1.125rem;
            font-weight: 600;
            margin-top: 0.75rem;
            margin-bottom: 0.375rem;
            display: block;
        }

        .markdown-content h4 {
            font-size: 1rem;
            font-weight: 600;
            margin-top: 0.5rem;
            margin-bottom: 0.25rem;
            display: block;
        }

        /* Ensure proper rendering of nested elements */
        .markdown-content * {
            box-sizing: border-box;
        }

        /* Collapsible metric coverage checklist */
        .metric-coverage-collapsible {
            margin-top: 0.75rem;
            padding: 0.5rem 0.75rem;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            background: #f9fafb;
            font-size: 0.875rem;
        }
        .metric-coverage-collapsible > summary {
            cursor: pointer;
            user-select: none;
            list-style: none;
            color: #374151;
        }
        .metric-coverage-collapsible > summary::-webkit-details-marker {
            display: none;
        }
        .metric-coverage-collapsible > summary::before {
            content: '▸ ';
            color: #6b7280;
        }
        .metric-coverage-collapsible[open] > summary::before {
            content: '▾ ';
        }
        .metric-coverage-collapsible table {
            margin-top: 0.5rem;
            font-size: 0.8125rem;
        }

        /* Styles for copy and export buttons */
        .message-buttons {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            display: flex;
            gap: 0.25rem;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
        }

        .group:hover .message-buttons {
            opacity: 1;
        }

        .group\/table:hover .message-buttons {
            opacity: 1;
        }

        .message-button {
            padding: 0.25rem;
            background-color: #f3f4f6;
            border-radius: 0.25rem;
            color: #4b5563;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
        }

        .message-button:hover {
            background-color: #e5e7eb;
        }

        /* Scrollbar styling */
        #chat-container::-webkit-scrollbar {
            width: 8px;
        }

        #chat-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        #chat-container::-webkit-scrollbar-thumb {
            background: #c7d2fe;
            border-radius: 4px;
        }

        #chat-container::-webkit-scrollbar-thumb:hover {
            background: #a5b4fc;
        }

        /* Toast notification */
        #toast-notification {
            transition: opacity 0.3s ease-in-out;
        }

        /* ============================================================
           SEQUENTIAL MODE STYLES
           ============================================================ */

        /* Task result card */
        .seq-task-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            overflow: hidden;
            transition: box-shadow 0.2s, border-color 0.2s;
        }

        .seq-task-card.running {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .seq-task-card.done {
            border-color: #10b981;
        }

        .seq-task-card.error {
            border-color: #ef4444;
        }

        /* Status indicator dots */
        .seq-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .seq-status-dot.pending {
            background: #d1d5db;
        }

        .seq-status-dot.running {
            background: #6366f1;
            animation: seqPulse 1.2s ease-in-out infinite;
        }

        .seq-status-dot.done {
            background: #10b981;
        }

        .seq-status-dot.error {
            background: #ef4444;
        }

        @keyframes seqPulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(0.82);
            }
        }

        /* Task list item in setup panel */
        .seq-task-item {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.375rem;
            padding: 0.5rem 0.75rem;
        }

        /* File drop zone */
        .seq-drop-zone {
            border: 2px dashed #d1d5db;
            border-radius: 0.5rem;
            padding: 1.25rem;
            text-align: center;
            transition: all 0.15s;
            cursor: pointer;
            background: white;
        }

        .seq-drop-zone:hover,
        .seq-drop-zone.drag-over {
            border-color: #6366f1;
            background: #eef2ff;
        }

        /* Sidebar Drawer Styles */
        #chat-sidebar {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        #chat-sidebar.collapsed {
            margin-left: -18rem; /* -288px */
        }
        
        .session-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0.75rem;
            border-radius: 0.375rem;
            cursor: pointer;
            color: #d1d5db;
            font-size: 0.875rem;
            transition: background-color 0.15s ease-in-out, color 0.15s ease-in-out;
            position: relative;
        }

        .session-item:hover {
            background-color: #1f2937;
            color: #ffffff;
        }

        .session-item.active {
            background-color: #374151;
            color: #ffffff;
            font-weight: 600;
        }

        .session-item .session-actions {
            display: none;
            gap: 0.25rem;
        }

        .session-item:hover .session-actions {
            display: flex;
        }

        .session-action-btn {
            padding: 0.125rem 0.25rem;
            border-radius: 0.25rem;
            color: #9ca3af;
            transition: color 0.15s, background-color 0.15s;
        }

        .session-action-btn:hover {
            color: #ffffff;
            background-color: #4b5563;
        }
    </style>
</head>

<body class="bg-white text-gray-900 flex flex-col h-screen overflow-hidden">
    <!-- Header -->
    <header class="bg-gray-100/70 border-b border-gray-300 shadow-md p-4 flex items-center justify-between">
        <div class="flex items-center">
            <!-- Sidebar Toggle Button -->
            <button id="toggle-sidebar-btn" onclick="toggleSidebar()" title="Toggle Chat History" class="mr-2 p-1.5 rounded-lg text-gray-700 hover:bg-gray-200 transition-colors focus:outline-none cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <!-- Logo SVG -->
            <svg class="w-8 h-8 mr-2" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
                <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
                <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
            <h1 class="text-xl font-bold">Analyst AI</h1>
        </div>
        <div class="flex items-center space-x-2">

            <div class="flex items-center space-x-2 bg-white rounded-md border border-gray-300 px-2 py-1 mr-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-500" viewBox="0 0 20 20"
                    fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.532 1.532 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.532 1.532 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z"
                        clip-rule="evenodd" />
                </svg>
                <select id="model-select"
                    class="text-sm border-none focus:ring-0 text-gray-700 font-semibold bg-transparent cursor-pointer outline-none">
                    <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                    <option value="gemini-3-flash-preview">Gemini 3 Flash Preview</option>
                    <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
                </select>
            </div>
            <button id="prompt-prefix-button"
                class="text-sm bg-green-600 hover:bg-green-500 px-3 py-1 rounded-md flex items-center font-semibold">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"
                        clip-rule="evenodd" />
                </svg>
                Prompt Prefix
            </button>
            <button id="reset-session-button"
                class="text-sm bg-red-600 hover:bg-red-500 px-3 py-1 rounded-md flex items-center font-semibold">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 110 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z"
                        clip-rule="evenodd" />
                </svg>
                Reset Session
            </button>

        </div>
    </header>

    <!-- Prompt Prefix Modal (hidden by default) -->
    <div id="prompt-prefix-modal"
        class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-6 rounded-lg shadow-lg max-w-2xl w-full mx-4">
            <h2 class="text-xl font-semibold mb-4 text-gray-900">Manage Prompt Prefixes</h2>

            <!-- Current Prefixes List -->
            <div class="mb-6">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-lg font-semibold text-gray-900">Saved Prefixes:</h3>
                    <button id="add-new-prompt-button"
                        class="text-sm bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1 rounded-md flex items-center font-semibold">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" viewBox="0 0 20 20"
                            fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
                                clip-rule="evenodd" />
                        </svg>
                        Add New Prompt
                    </button>
                </div>
                <div id="prefix-list" class="space-y-2 max-h-40 overflow-y-auto">
                    <!-- Prefixes will be populated here -->
                </div>
            </div>

            <!-- Add/Edit Prefix Form -->
            <form id="prefix-form" class="space-y-4">
                <div>
                    <label for="prefix-name" class="block mb-1 font-semibold text-gray-900">Prefix Name:</label>
                    <input type="text" id="prefix-name"
                        class="w-full bg-white border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                        placeholder="e.g., ESG Analysis, Document Review">
                </div>
                <div>
                    <label for="prefix-content" class="block mb-1 font-semibold text-gray-900">Prefix Content:</label>
                    <textarea id="prefix-content" rows="4"
                        class="w-full bg-white border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                        placeholder="Enter your prompt content here..."></textarea>
                </div>
                <div class="flex justify-between items-center">
                    <div class="flex items-center space-x-2">
                        <input type="checkbox" id="auto-apply-prefix"
                            class="w-4 h-4 text-green-600 bg-white border-gray-300 rounded focus:ring-green-500">
                        <label for="auto-apply-prefix" class="text-sm text-gray-700">Auto-apply this prefix to new
                            messages</label>
                    </div>
                    <div class="space-x-2">
                        <button type="button" id="clear-prefix-form"
                            class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-md font-semibold">Clear</button>
                        <button type="submit" id="save-prefix"
                            class="px-4 py-2 bg-green-600 hover:bg-green-500 rounded-md font-semibold">Save
                            Prefix</button>
                    </div>
                </div>
            </form>

            <!-- Modal Actions -->
            <div class="flex justify-between mt-6 pt-4 border-t border-gray-300">
                <div class="flex items-center space-x-2">
                    <label for="active-prefix-select" class="text-sm font-semibold text-gray-900">Active Prefix:</label>
                    <select id="active-prefix-select"
                        class="bg-white border border-gray-300 rounded-md px-3 py-1 focus:outline-none focus:ring-2 focus:ring-green-500">
                        <option value="">None</option>
                    </select>
                </div>
                <button type="button" id="close-prefix-modal"
                    class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-md font-semibold">Close</button>
            </div>
        </div>
    </div>

    <!-- Storage & Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-6 rounded-lg shadow-xl max-w-md w-full mx-4 border border-gray-200">
            <div class="flex items-center justify-between pb-3 mb-4 border-b border-gray-200">
                <div class="flex items-center space-x-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <h2 class="text-xl font-bold text-gray-900">Settings & Storage</h2>
                </div>
                <button id="close-settings-modal-x" onclick="closeSettingsModal()" class="text-gray-400 hover:text-gray-600 focus:outline-none cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div class="space-y-4">
                <!-- Storage Info Box -->
                <div class="bg-indigo-50 border border-indigo-200 rounded-md p-3 text-xs text-indigo-900 space-y-1">
                    <div class="flex justify-between font-semibold">
                        <span>Retention Policy:</span>
                        <span>48 Hours Auto-Purge</span>
                    </div>
                    <div class="flex justify-between text-indigo-700">
                        <span>Active Saved Sessions:</span>
                        <span id="settings-session-count" class="font-bold">0</span>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="space-y-2 pt-2">
                    <!-- Clear All Chat Sessions -->
                    <button id="clear-all-sessions-btn" onclick="clearAllChatSessions()" class="w-full flex items-center justify-between p-3 bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 rounded-md font-semibold text-sm transition-colors cursor-pointer">
                        <div class="flex items-center space-x-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                            <span>Clear All Chat Sessions</span>
                        </div>
                        <span class="text-xs text-red-500 font-normal">Purge saved chats</span>
                    </button>

                    <!-- Clear All Local Storage -->
                    <button id="clear-all-storage-btn" onclick="wipeAllLocalStorage()" class="w-full flex items-center justify-between p-3 bg-gray-100 hover:bg-gray-200 text-gray-800 border border-gray-300 rounded-md font-semibold text-sm transition-colors cursor-pointer">
                        <div class="flex items-center space-x-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
                            </svg>
                            <span>Wipe All Local Storage</span>
                        </div>
                        <span class="text-xs text-gray-500 font-normal">Full reset</span>
                    </button>

                    <!-- Export Chat Backup JSON -->
                    <button id="export-sessions-btn" onclick="exportChatSessionsJSON()" class="w-full flex items-center justify-between p-3 bg-gray-50 hover:bg-gray-100 text-gray-700 border border-gray-200 rounded-md font-semibold text-sm transition-colors cursor-pointer">
                        <div class="flex items-center space-x-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                            </svg>
                            <span>Export Chat History (JSON)</span>
                        </div>
                        <span class="text-xs text-gray-500 font-normal">Download</span>
                    </button>
                </div>
            </div>

            <div class="mt-6 pt-3 border-t border-gray-200 flex justify-end">
                <button id="close-settings-modal-btn" onclick="closeSettingsModal()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-md text-sm font-semibold text-gray-800 cursor-pointer">Close</button>
            </div>
        </div>
    </div>



    <!-- Main App Flex Container (Sidebar + Chat Area) -->
    <div class="flex flex-1 overflow-hidden relative">

        <!-- Left Sidebar Drawer -->
        <aside id="chat-sidebar" class="w-72 bg-gray-900 text-gray-200 flex flex-col border-r border-gray-800 shrink-0 transition-all duration-300 ease-in-out z-30">
            <!-- New Chat Button Header -->
            <div class="p-3 border-b border-gray-800 flex items-center justify-between">
                <button id="new-chat-btn" onclick="createNewChatSession()" class="flex-1 flex items-center justify-center space-x-2 bg-indigo-600 hover:bg-indigo-500 text-white py-2 px-3 rounded-md text-sm font-semibold transition-colors shadow-sm cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    <span>New Chat</span>
                </button>
            </div>
            
            <!-- Chat Sessions History List -->
            <div id="sidebar-sessions-list" class="flex-1 overflow-y-auto p-2 space-y-4">
                <!-- Populated dynamically via index.js -->
            </div>

            <!-- Sidebar Footer Notice & Settings Icon -->
            <div class="p-3 border-t border-gray-800 text-xs text-gray-400 flex items-center justify-between">
                <div class="flex items-center space-x-1.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-indigo-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>Chats saved for 48 hrs</span>
                </div>
                <button id="settings-btn" onclick="openSettingsModal()" title="Storage & Settings" class="p-1.5 rounded-md hover:bg-gray-800 text-gray-400 hover:text-white transition-colors focus:outline-none cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>
            </div>
        </aside>

        <!-- Chat Mode Wrapper -->
        <div id="chat-mode-wrapper" class="flex flex-col flex-1 overflow-hidden min-w-0">

        <!-- Chat Window -->
        <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 relative">
            <!-- Drag and Drop Overlay -->
            <div id="drag-overlay"
                class="hidden absolute inset-0 bg-indigo-600/20 border-2 border-dashed border-indigo-400 rounded-lg flex items-center justify-center z-10">
                <div class="text-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto mb-2 text-indigo-600" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    <p class="text-lg font-semibold text-indigo-600">Drop your files here</p>
                    <p class="text-sm text-indigo-700">Supports PDF, DOCX, TXT, HTML files</p>
                </div>
            </div>
            <!-- Messages will be dynamically inserted here -->
        </main>

        <!-- Input Area -->
        <footer class="border-t border-gray-300 p-4">
            <!-- Active Prefix Indicator (hidden by default) -->
            <div id="active-prefix-indicator"
                class="hidden mb-2 p-2 bg-green-100 border border-green-300 rounded flex items-center justify-between">
                <div class="flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2 text-green-600" viewBox="0 0 20 20"
                        fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z"
                            clip-rule="evenodd" />
                    </svg>
                    <span class="text-sm text-green-800">Active prefix: <span id="active-prefix-name"
                            class="font-semibold"></span></span>
                </div>
                <button id="remove-active-prefix" class="ml-2 text-green-600 hover:text-green-800">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                            clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
            <!-- File Preview (hidden by default) -->
            <div id="file-preview" class="hidden mb-2">
                <div class="p-2 bg-gray-100 rounded">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm font-semibold text-gray-700">Selected Files:</span>
                        <button id="remove-all-files" class="text-red-600 hover:text-red-800 text-sm">
                            Clear All
                        </button>
                    </div>
                    <div id="file-list" class="space-y-1">
                        <!-- Files will be listed here -->
                    </div>
                </div>
            </div>



            <!-- Upload Progress (hidden by default, shown during File API upload) -->
            <div id="upload-progress" class="hidden mb-2 p-2 bg-blue-50 border border-blue-200 rounded-md">
                <div class="flex items-center justify-between mb-1">
                    <span id="upload-progress-label" class="text-sm text-blue-800 truncate flex-1 mr-2">Uploading...</span>
                    <span id="upload-progress-pct" class="text-sm font-semibold text-blue-700 flex-shrink-0">0%</span>
                </div>
                <div class="w-full bg-blue-200 rounded-full h-1.5">
                    <div id="upload-progress-bar" class="bg-blue-500 h-1.5 rounded-full transition-all duration-200" style="width: 0%"></div>
                </div>
            </div>

            <!-- Input Form -->
            <form id="chat-form" class="flex items-center space-x-2">
                <!-- Attach File Button -->
                <button id="attach-button" type="button" class="p-2 rounded-full hover:bg-gray-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-700" viewBox="0 0 20 20"
                        fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M8 4a3 3 0 00-3 3v4a5 5 0 0010 0V7a1 1 0 112 0v4a7 7 0 11-14 0V7a5 5 0 0110 0v4a3 3 0 11-6 0V7a1 1 0 012 0v4a1 1 0 102 0V7a3 3 0 00-3-3z"
                            clip-rule="evenodd" />
                    </svg>
                </button>

                <!-- Hidden File Input -->
                <input type="file" id="file-input" class="hidden"
                    accept=".pdf,.docx,.txt,.html,.htm,.jpg,.jpeg,.png,.gif,.bmp,.tiff" multiple>

                <!-- Text Input -->
                <input type="text" id="message-input"
                    class="flex-1 bg-white border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    placeholder="Follow-up question… or leave empty and Send to run extraction"
                    autocomplete="off">

                <!-- Quick Prompt Selector -->
                <div class="relative">
                    <button id="quick-prompt-button" type="button" class="p-2 rounded-full hover:bg-gray-200 relative"
                        title="Quick Prompt Selection">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-700" viewBox="0 0 20 20"
                            fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                                clip-rule="evenodd" />
                        </svg>
                    </button>
                    <!-- Dropdown Menu -->
                    <div id="quick-prompt-dropdown"
                        class="hidden absolute bottom-full right-0 mb-2 w-64 bg-white border border-gray-300 rounded-md shadow-lg z-20">
                        <div class="p-2 border-b border-gray-300">
                            <p class="text-sm font-semibold text-gray-700">Quick Prompt Selection</p>
                        </div>
                        <div id="quick-prompt-list" class="max-h-48 overflow-y-auto">
                            <button type="button"
                                class="w-full text-left px-3 py-2 hover:bg-gray-100 text-sm text-gray-700"
                                data-prefix-id="">
                                <span class="font-semibold">None</span>
                                <p class="text-xs text-gray-500">No prefix applied</p>
                            </button>
                            <!-- Prefixes will be populated here -->
                        </div>
                        <div class="p-2 border-t border-gray-300">
                            <button type="button" id="manage-prefixes-link"
                                class="w-full text-left px-2 py-1 hover:bg-gray-100 text-xs text-indigo-600">
                                Manage Prefixes...
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Send Button -->
                <button type="submit" id="send-button" class="p-2 bg-indigo-600 rounded-full hover:bg-indigo-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" viewBox="0 0 20 20"
                        fill="currentColor">
                        <path
                            d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                    </svg>
                </button>
            </form>
        </footer>

    </div><!-- /chat-mode-wrapper -->
    </div><!-- /Main App Flex Container -->

    <!-- Main JavaScript -->
    <script type="module" src="./index.js"></script>
</body>

</html>
